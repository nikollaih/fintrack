[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && npm install && npm run build && (php artisan storage:link || true) && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[deploy]
startCommand = "php artisan migrate --force; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
